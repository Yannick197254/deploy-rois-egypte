<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rois d'Égypte antique</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #000;
    overflow: hidden;
  }
  #fond {
    position: fixed; inset: 0;
    background: url('statuette.jpg') center center / cover no-repeat;
  }
  #voile {
    position: fixed; inset: 0;
    background: rgba(10, 8, 5, 0.25);
  }
  #titre {
    position: fixed; top: 5%; left: 0; right: 0;
    text-align: center; color: #f6e3ac;
    font-family: Georgia, serif; font-size: clamp(20px, 4vw, 34px);
    text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    letter-spacing: 1px;
    pointer-events: none;
  }
  #zone-clic {
    position: fixed;
    left: 40%; top: 15%; width: 20%; height: 56%;
    cursor: pointer;
    border-radius: 6px;
    transition: box-shadow 0.4s ease, background 0.4s ease;
  }
  #zone-clic:hover, #zone-clic:focus {
    box-shadow: 0 0 0 3px rgba(246,227,172,0.55), 0 0 40px 12px rgba(246,227,172,0.35);
    background: rgba(246,227,172,0.06);
  }
  #indice {
    position: fixed; bottom: 8%; left: 0; right: 0;
    text-align: center; color: #f6e3ac;
    font-size: clamp(12px, 2vw, 15px);
    text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    letter-spacing: 0.5px;
    opacity: 0.9;
    animation: respire 2.6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes respire { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
</style>
</head>
<body>

<div id="fond"></div>
<div id="voile"></div>
<div id="titre">𓂀 Rois d'Égypte antique</div>

<a id="zone-clic" href="encodage.html" aria-label="Entrer dans l'arbre généalogique"></a>

<div id="indice">touchez la statuette pour entrer</div>

</body>
</html>
